name: University ERP — CI/CD Pipeline
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: cuong1216/university-erp/backend
  IMAGE_NAME_FRONTEND: cuong1216/university-erp/frontend
jobs:
  # Job 1: Unit + Integration Tests (Backend)
  test-backend:
    name: Build & Verify Spring Boot Backend (TDD Gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: university_erp_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Run Maven Verification & JaCoCo Coverage Report
        run: |
          cd backend
          mvn clean verify jacoco:report -DDB_URL=jdbc:postgresql://localhost:5432/university_erp_db -DDB_USERNAME=postgres -DDB_PASSWORD=postgrespassword -Dai.datasource.username=postgres -Dai.datasource.password=postgrespassword -DDDL_AUTO=create-drop

      - name: Check Coverage Threshold
        run: |
          cd backend
          mvn jacoco:check -Djacoco.check.line.minimum=0.25

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/

  # Job 2: Lint + Build (Frontend)
  test-frontend:
    name: Lint & Build React Vite Frontend (Quality Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint & Production Build
        run: |
          cd frontend
          npm run lint && npm run build

  # Job 3: Security Scan (Temporarily disabled due to NVD API limits/DB errors)
  # security-scan:
  #   name: Security Scan (OWASP)
  #   needs: [test-backend]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout Code
  #       uses: actions/checkout@v4
  #
  #     - name: Set up JDK 21
  #       uses: actions/setup-java@v5.6.0
  #       with:
  #         java-version: '21'
  #         distribution: 'temurin'
  #         cache: 'maven'
  #         cache-dependency-path: backend/pom.xml
  #
  #     - name: OWASP Dependency Check
  #       run: |
  #         cd backend
  #         mvn org.owasp:dependency-check-maven:check
  #
  #     - name: Upload OWASP Report
  #       uses: actions/upload-artifact@v4
  #       if: always()
  #       with:
  #         name: dependency-check-report
  #         path: backend/target/dependency-check-report.html

  # Job 4: Build Docker Images
  build-images:
    name: Build & Push Images to GHCR
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push Backend
        run: |
          cd backend
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}

      - name: Build & Push Frontend
        run: |
          cd frontend
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }} --build-arg VITE_API_BASE_URL=/api/v1 .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}

  # Job 5: Deploy to Staging (tự động)
  deploy-staging:
    name: Deploy to Staging
    needs: build-images
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          FRONTEND_IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_STAGING_KEY }}
          envs: BACKEND_IMG,FRONTEND_IMG
          script: |
            cd /opt/university-erp
            export BACKEND_IMAGE=$BACKEND_IMG
            export FRONTEND_IMAGE=$FRONTEND_IMG
            docker compose pull
            docker compose up -d --wait

      - name: Health Check
        run: |
          curl -f http://${{ secrets.STAGING_HOST }}/api/v1/actuator/health || curl -f http://${{ secrets.STAGING_HOST }}/actuator/health

  # Job 6: Smoke Test
  smoke-test:
    name: Smoke Test (Staging)
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Test Unauthorized Access (401)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.STAGING_HOST }}/api/v1/dashboard/salary-stats)
          if [ "$STATUS" -ne 401 ] && [ "$STATUS" -ne 403 ]; then
            echo "Expected 401/403 but got $STATUS"
            exit 1
          fi

      - name: Test Actuator Health (status UP)
        run: |
          curl -s http://${{ secrets.STAGING_HOST }}/api/v1/actuator/health | grep -q '"status":"UP"' || curl -s http://${{ secrets.STAGING_HOST }}/actuator/health | grep -q '"status":"UP"'

      - name: Test Login Token
        run: |
          RESPONSE=$(curl -s -X POST http://${{ secrets.STAGING_HOST }}/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin", "password":"admin123"}')
          echo $RESPONSE | grep -q '"token"'

  # Job 7: Deploy Production (manual approval)
  deploy-prod:
    name: Deploy to Production
    needs: smoke-test
    environment:
      name: production
      url: https://erp.university.edu.vn
    runs-on: ubuntu-latest
    steps:
      - name: Save Previous Stable Tag
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PROD_KEY }}
          script: |
            cd /opt/university-erp
            CURRENT_TAG=$(docker ps --filter "name=backend" --format "{{.Image}}" | cut -d':' -f2 | head -n 1)
            if [ -z "$CURRENT_TAG" ]; then
              CURRENT_TAG="latest"
            fi
            echo $CURRENT_TAG > .prev-stable-tag
            echo "Previous stable tag saved: $CURRENT_TAG"

      - name: SSH & Blue-Green / Rolling Update
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          FRONTEND_IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PROD_KEY }}
          envs: BACKEND_IMG,FRONTEND_IMG
          script: |
            cd /opt/university-erp
            export BACKEND_IMAGE=$BACKEND_IMG
            export FRONTEND_IMAGE=$FRONTEND_IMG
            docker compose pull
            docker compose up -d --wait

      - name: Post-Deploy Health Check
        run: curl -f https://erp.university.edu.vn/api/v1/actuator/health

      - name: Auto-rollback on Failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PROD_KEY }}
          script: |
            cd /opt/university-erp
            echo "Deployment failed! Rolling back..."
            PREV_TAG=$(cat .prev-stable-tag 2>/dev/null || echo "latest")
            export BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:$PREV_TAG
            export FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:$PREV_TAG
            docker compose up -d --wait
            curl -f https://erp.university.edu.vn/api/v1/actuator/health || (echo "ROLLBACK FAILED" && exit 1)
            echo "ROLLBACK COMPLETED to tag: $PREV_TAG"

      - name: Slack Notification - Success
        if: success()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' --data '{"text":"✅ Production Deployment Successful! Tag: ${{ github.sha }}"}' ${{ secrets.SLACK_WEBHOOK_URL }}
          fi

      - name: Slack Notification - Rollback
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 Production Deployment Failed! Rollback triggered."}' ${{ secrets.SLACK_WEBHOOK_URL }}
          fi
