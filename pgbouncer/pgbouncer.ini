[databases]
# Forward connections to the 'postgres' service on port 5432
university_erp_db = host=postgres port=5432 dbname=university_erp_db

[pgbouncer]
listen_port = 6432
listen_addr = *
auth_type = any
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 50
reserve_pool_size = 20
reserve_pool_timeout = 5

# Logging settings
log_connections = 0
log_disconnections = 0

ignore_startup_parameters = extra_float_digits
